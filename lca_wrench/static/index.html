<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LCA Wrench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3Cmask id='lwMask'%3E%3Crect width='120' height='120' fill='%23fff'/%3E%3Ccircle cx='60' cy='60' r='14' fill='%23000'/%3E%3C/mask%3E%3C/defs%3E%3Cpath d='M60 8 L105 34 L105 86 L60 112 L15 86 L15 34 Z' fill='none' stroke='%23D9DEDB' stroke-width='9' stroke-linejoin='round'/%3E%3Cpath d='M60 8 L105 34 L105 86 L60 112 L15 86 L15 34 Z' fill='%2315201B' stroke='%2315201B' stroke-width='6' stroke-linejoin='round' mask='url%28%23lwMask%29'/%3E%3Cpath d='M56.2 20.2 A40 40 0 0 1 98.5 70.7 L85.8 78.9 L83.1 66.4 A24 24 0 0 0 57.7 36.1 L68.4 29.1 Z' fill='%234CC2A6' stroke='%234CC2A6' stroke-width='0.8' stroke-linejoin='round'/%3E%3Cpath d='M96.4 76.6 A40 40 0 0 1 31.5 88.0 L30.7 73.0 L42.9 76.8 A24 24 0 0 0 81.8 70.0 L82.6 82.7 Z' fill='%23F4C95D' stroke='%23F4C95D' stroke-width='0.8' stroke-linejoin='round'/%3E%3Cpath d='M27.4 83.2 A40 40 0 0 1 50.0 21.3 L63.4 28.2 L54.0 36.8 A24 24 0 0 0 40.5 73.9 L29.1 68.2 Z' fill='%23E8664A' stroke='%23E8664A' stroke-width='0.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
/* Apply saved theme before CSS paint — avoids OS-preference flicker */
(function () {
  try {
    var t = localStorage.getItem('wb-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* ignore */ }
})();
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 120 120" aria-hidden="true"><defs><mask id="lwMask"><rect width="120" height="120" fill="#fff"/><circle cx="60" cy="60" r="14" fill="#000"/></mask></defs><path d="M60 8 L105 34 L105 86 L60 112 L15 86 L15 34 Z" fill="none" stroke="#D9DEDB" stroke-width="8" stroke-linejoin="round"/><path d="M60 8 L105 34 L105 86 L60 112 L15 86 L15 34 Z" fill="#15201B" stroke="#15201B" stroke-width="6" stroke-linejoin="round" mask="url(#lwMask)"/><path d="M56.2 20.2 A40 40 0 0 1 98.5 70.7 L85.8 78.9 L83.1 66.4 A24 24 0 0 0 57.7 36.1 L68.4 29.1 Z" fill="#4CC2A6" stroke="#4CC2A6" stroke-width="0.8" stroke-linejoin="round"/><path d="M96.4 76.6 A40 40 0 0 1 31.5 88.0 L30.7 73.0 L42.9 76.8 A24 24 0 0 0 81.8 70.0 L82.6 82.7 Z" fill="#F4C95D" stroke="#F4C95D" stroke-width="0.8" stroke-linejoin="round"/><path d="M27.4 83.2 A40 40 0 0 1 50.0 21.3 L63.4 28.2 L54.0 36.8 A24 24 0 0 0 40.5 73.9 L29.1 68.2 Z" fill="#E8664A" stroke="#E8664A" stroke-width="0.8" stroke-linejoin="round"/></svg><b id="brandName">LCA Wrench</b><span class="chip acc">Brightway</span></div>
    <label class="f"><span id="projLabel">Project</span><select id="projSel"></select></label>
    <label class="f"><span id="famLabel">Method</span><select id="famSel"></select></label>
    <label class="f"><span id="methLabel">Impact category</span><select id="methSel"></select></label>
    <label class="f" id="bgBox" hidden><span id="bgLabel">Background</span><select id="bgSel"></select></label>
    <span id="copyChip"></span>
    <span id="busy"></span>
    <div class="topbtns">
      <button class="btn" data-act="undo" id="undoBtn" hidden>↶ Undo</button>
      <button class="btn" data-act="tour" id="tourBtn">Tour</button>
      <button class="btn" data-act="explain" id="explainBtn" aria-pressed="true">Help on</button>
      <button class="btn" data-act="lang" id="langBtn">Deutsch</button>
    </div>
  </header>
  <nav class="rail" aria-label="Views" id="railNav">
    <div class="rail-in">
      <div class="rail-navs" id="rail"></div>
      <div class="rail-theme" id="themeToggle" role="group" aria-label="Theme">
        <button type="button" class="theme-opt" data-act="set-theme" data-k="light" id="themeLight" title="Light" aria-label="Light" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="theme-opt" data-act="set-theme" data-k="dark" id="themeDark" title="Dark" aria-label="Dark" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>
        </button>
      </div>    </div>
  </nav>
  <main id="main"></main>
</div>
<dialog id="dlg" aria-label="Dialog"><div id="dlgBody"></div></dialog>
<div class="agent-hold" id="agentHold" hidden aria-live="polite" aria-atomic="true">
  <div class="agent-hold-hue" aria-hidden="true"></div>
  <span class="agent-hold-status" id="agentHoldTitle" role="status">Agent working…</span>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
